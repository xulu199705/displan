server {
    listen 80;
    server_name 192.168.30.141;

    root /var/www/tnc-services;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /displan {
        return 301 /displan/$is_args$args;
    }

    location ^~ /displan/ {
        proxy_pass http://127.0.0.1:55432/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location = /display_plan_note/U-3-A-343432 {
        return 301 /display_plan_note/U-3-A-343432/$is_args$args;
    }

    location ^~ /display_plan_note/U-3-A-343432/ {
        proxy_pass http://127.0.0.1:55431/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
